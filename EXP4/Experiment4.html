<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOTEL ROOM BOOKING FORM</title>
</head>

<body>

    <h1>Hotel Room Booking Form</h1>

    <form action="#" method="post">

        <label for="fullname">Full name:</label>

        <input type="text" id="fullname" required>


        <br>

        <label for="emailtoo">Email:</label>

        <input type="email" id="emailtoo" required>

        <br>

        <label for="phonenumber">phone:</label>

        <input type="number" id="phonenumber" required>

        <br>

        <label for="datee">Check-in-date</label>

        <input type="date" id="datee" required>
        
        <br>

        <label for="dateee">Check-out-date</label>

        <input type="date" id="dateee" required>
        <br>
        <label for="roomkey">Room Type:</label>
        <select id="roomkey" required>
            <option value="">select room type</option>
            <option value="double">double bed</option>
            <option value="delux">prime delux</option>
        </select>

        <br>
        <label for="fullname">Number of Guests:</label>

        <input type="number" id="fullname" min="1" max="10" required>

        <br>
        <label for="special_requests">special requests:</label>
        <br>
        <textarea name="" id="special_requests" placeholder="enter any extra message" rows="4" cols="40"></textarea>
        <br>
        <input type="submit" id="" value="BOOK NOW">
        <input type="reset" id="" value="RESET FORM">
        

        





    </form>

    

    

    
</body>

</html>
